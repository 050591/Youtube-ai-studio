<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>YT-Viral-Genius | One-Prompt Video Creator</title>
    <script src="https://cdn.tailwindcss.com"></script>
</head>
<body class="bg-gray-950 text-white min-h-screen flex flex-col items-center p-6">

    <div class="max-w-3xl w-full space-y-6">
        <!-- Header -->
        <div class="flex items-center justify-between border-b border-gray-800 pb-4">
            <div>
                <h1 class="text-2xl font-bold bg-gradient-to-r from-red-500 to-amber-400 bg-clip-text text-transparent">
                    🎬 YT-Viral-Genius Studio
                </h1>
                <p class="text-sm text-gray-400">One Prompt → Full Video (Script + Voice + Visuals + Subtitles)</p>
            </div>
            <span class="px-3 py-1 bg-red-600/20 text-red-400 text-xs rounded-full border border-red-500/30">
                AI Agent v2.0
            </span>
        </div>

        <!-- Prompt Input Card -->
        <div class="bg-gray-900 p-5 rounded-2xl border border-gray-800 space-y-4 shadow-xl">
            <label class="block text-sm font-medium text-gray-300">Video Idea / Prompt</label>
            <textarea id="promptInput" rows="3" 
                class="w-full bg-gray-950 border border-gray-700 rounded-xl p-3 text-white focus:border-red-500 focus:outline-none"
                placeholder="Ex: Chennai office traffic-la maatikitta oru stickman oda comedy story..."></textarea>

            <div class="grid grid-cols-2 gap-4">
                <div>
                    <label class="block text-xs text-gray-400 mb-1">Animation Style</label>
                    <select id="styleInput" class="w-full bg-gray-950 border border-gray-700 rounded-lg p-2.5 text-sm">
                        <option value="2D Stickman Comedy">2D Stickman Comedy</option>
                        <option value="3D Kids Nursery Rhyme">3D Kids Nursery Rhyme</option>
                        <option value="Cute Chibi Cartoon">Cute Chibi Cartoon</option>
                        <option value="Cinematic Story">Cinematic Story</option>
                    </select>
                </div>
                <div>
                    <label class="block text-xs text-gray-400 mb-1">Voiceover Language</label>
                    <select id="langInput" class="w-full bg-gray-950 border border-gray-700 rounded-lg p-2.5 text-sm">
                        <option value="Tamil">Tamil (தமிழ்)</option>
                        <option value="English">English</option>
                    </select>
                </div>
            </div>

            <button onclick="generateVideo()" id="genBtn"
                class="w-full py-3 bg-gradient-to-r from-red-600 to-orange-500 hover:from-red-500 hover:to-orange-400 font-semibold rounded-xl transition shadow-lg">
                ✨ Generate Full Video
            </button>
        </div>

        <!-- Progress Section -->
        <div id="progressBox" class="hidden bg-gray-900 p-5 rounded-2xl border border-gray-800 space-y-3">
            <div class="flex justify-between text-sm">
                <span id="statusText" class="text-amber-400 font-medium">Initializing AI Agent...</span>
                <span id="percentText" class="text-gray-400">0%</span>
            </div>
            <div class="w-full bg-gray-800 rounded-full h-2.5">
                <div id="progressBar" class="bg-red-500 h-2.5 rounded-full transition-all duration-500" style="width: 5%"></div>
            </div>
        </div>

        <!-- Output Video & Scene Timeline -->
        <div id="resultBox" class="hidden grid md:grid-cols-2 gap-6 bg-gray-900 p-5 rounded-2xl border border-gray-800">
            <div class="flex flex-col items-center">
                <video id="videoPlayer" controls class="w-64 rounded-xl border border-gray-700 shadow-2xl"></video>
                <a id="downloadLink" download="yt_viral_video.mp4" 
                   class="mt-4 w-64 text-center py-2.5 bg-emerald-600 hover:bg-emerald-500 rounded-xl font-medium text-sm">
                    ⬇️ Download MP4 Video
                </a>
            </div>
            <div class="space-y-3">
                <h3 class="font-semibold text-gray-200 border-b border-gray-800 pb-2">🎞️ Generated Scene Timeline</h3>
                <div id="scenesList" class="space-y-2.5 max-h-96 overflow-y-auto pr-1 text-xs"></div>
            </div>
        </div>
    </div>

    <script>
        async function generateVideo() {
            const prompt = document.getElementById("promptInput").value;
            if (!prompt.trim()) return alert("Please enter a prompt!");

            document.getElementById("genBtn").disabled = true;
            document.getElementById("progressBox").classList.remove("hidden");
            document.getElementById("resultBox").classList.add("hidden");

            const res = await fetch("/generate", {
                method: "POST",
                headers: { "Content-Type": "application/json" },
                body: JSON.stringify({
                    prompt: prompt,
                    style: document.getElementById("styleInput").value,
                    language: document.getElementById("langInput").value
                })
            });
            const data = await res.json();
            pollStatus(data.job_id);
        }

        function pollStatus(jobId) {
            const interval = setInterval(async () => {
                const res = await fetch(`/status/${jobId}`);
                const data = await res.json();

                document.getElementById("statusText").innerText = data.status;
                document.getElementById("percentText").innerText = data.progress + "%";
                document.getElementById("progressBar").style.width = data.progress + "%";

                if (data.status === "Completed") {
                    clearInterval(interval);
                    document.getElementById("genBtn").disabled = false;
                    document.getElementById("resultBox").classList.remove("hidden");
                    
                    const player = document.getElementById("videoPlayer");
                    player.src = data.video_url;
                    document.getElementById("downloadLink").href = data.video_url;

                    const list = document.getElementById("scenesList");
                    list.innerHTML = data.scenes.map(s => `
                        <div class="p-3 bg-gray-950 rounded-lg border border-gray-800">
                            <div class="text-red-400 font-bold">Scene ${s.scene_number}</div>
                            <div class="text-gray-300 mt-1">🎙️ "${s.voiceover}"</div>
                            <div class="text-gray-500 mt-1">🎨 ${s.visual_prompt}</div>
                        </div>
                    `).join("");
                } else if (data.status.startsWith("Error")) {
                    clearInterval(interval);
                    document.getElementById("genBtn").disabled = false;
                }
            }, 2000);
        }
    </script>
</body>
</html>
